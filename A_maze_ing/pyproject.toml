[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen.lvillarvabad"
version = "1.0.0"
description = "A reusable maze generation and solving module"
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

authors = [
    { name = "LuisVillar" },
    { name = "VictorAbad" }
]

[tool.setuptools]
py-modules = ["a-maze-ing"]

[tool.setuptools.packages.find]
where = ["."]